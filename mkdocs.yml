site_name: Tishev · Detections
site_url: https://tishev-sec.github.io/detections/
site_description: Detection engineering ideas shared as KQL and Sigma rules
repo_url: https://github.com/tishev-sec/detections
repo_name: tishev-sec/detections
edit_uri: ""
theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: { icon: material/brightness-4, name: Light mode }
  features:
    - content.code.copy
    - navigation.instant
    - search.highlight
markdown_extensions:
  - tables
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc: { permalink: true }
